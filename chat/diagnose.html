<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat Diagnostics</title>
  <style>
    body { font-family: system-ui; padding: 24px; max-width: 720px; margin: 0 auto; line-height: 1.5; }
    h1 { font-size: 20px; }
    pre { background: #f5f5f5; padding: 12px; border-radius: 8px; overflow-x: auto; font-size: 13px; }
    .ok { color: #137333; font-weight: 600; }
    .bad { color: #d93025; font-weight: 600; }
    code { background: #eee; padding: 1px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Backchannel Chat — connectivity diagnostics</h1>
  <div id="out"><p>Running checks…</p></div>

  <script src="firebase-config.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

    const out = document.getElementById("out");
    const log = (s) => { const p = document.createElement("div"); p.innerHTML = s; out.appendChild(p); };
    const line = (label, msg, ok) => log('<div>' + label + ': <span class="' + (ok ? 'ok">PASS' : 'bad">FAIL') + '</span> — ' + msg + '</div>');

    async function seedProbe(db, email) {
      const owner = (email || "").trim().toLowerCase() === "mikemacfadden@gmail.com";
      if (!owner) { line("Seed write probe", "Skipped (not owner session)", true); return; }
      try {
        await setDoc(doc(db, "settings", "access"), { adminEmails: ["mikemacfadden@gmail.com"] });
        line("Seed write probe", "settings/access created OK — the owner seed works", true);
      } catch (e) {
        line("Seed write probe", e.code + ": " + e.message, false);
      }
      const snap = await getDoc(doc(db, "settings", "access")).catch((e) => ({ exists: () => false, data: () => ({}) }));
      line("settings/access doc", snap.exists() ? "EXISTS — adminEmails: " + JSON.stringify(snap.data().adminEmails || []) : "does NOT exist yet", true);
    }

    line("SDK import", "Firebase JS v12 loaded from CDN", true);

    let configOk = false;
    try {
      if (window.FIREBASE_CONFIG && window.FIREBASE_CONFIG.projectId === "backchannel-chat-d0d9c") configOk = true;
      line("Config file", configOk ? "projectId backchannel-chat-d0d9c found" : "config missing!", configOk);
    } catch (e) { line("Config file", e.message, false); }

    try {
      const app = initializeApp(window.FIREBASE_CONFIG);
      const auth = getAuth(app);

      onAuthStateChanged(auth, (u) => {
        if (u) {
          const owner = (u.email || "").trim().toLowerCase() === "mikemacfadden@gmail.com";
          line("Auth state", "Signed in as " + u.email + " (uid " + u.uid.slice(0,8) + "…, isOwner:" + owner + ")", true);
          seedProbe(db, u.email);
        }
        else line("Auth state", "Signed out — Login screen is expected. Click ‘Sign in with Google’.", true);
      });

      // Firestore connectivity + settings read
      const db = getFirestore(app);
      getDoc(doc(db, "settings", "access")).then((snap) => {
        if (snap.exists()) {
          const emails = snap.data().adminEmails || [];
          line("settings/access doc", "EXISTS — adminEmails: " + JSON.stringify(emails), true);
        } else {
          line("settings/access doc", "does NOT exist yet (expected on first run — owner must click ‘Create access document’)", true);
        }
      }).catch((e) => {
        line("settings/access read", e.code + ": " + e.message, false);
      });

      // Direct room read test (demo room does not exist)
      getDoc(doc(db, "rooms", "demo")).then((snap) => {
        line("rooms/demo read", snap.exists() ? "room EXISTS" : "room does not exist (normal for a demo code)", true);
      }).catch((e) => {
        line("rooms/demo read", e.code + ": " + e.message, false);
      });

      // Detect network/firebase init failure
      setTimeout(() => {
        log("<p><em>If the two Firestore lines above never appeared, something blocked Firebase from reaching the backend (network/firewall/adblock or the Google API is disabled).</em></p>");
      }, 12000);
    } catch (e) {
      line("App init", e.message, false);
    }
  </script>
</body>
</html>
